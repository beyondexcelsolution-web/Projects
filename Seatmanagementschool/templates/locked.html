<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Verification - Crescent Seat Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Inter', sans-serif;
        }
        .lock-container {
            max-width: 580px;
            width: 100%;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            text-align: center;
        }
        .lock-header {
            background: #F1F5F9;
            padding: 2.25rem 2rem 1.75rem;
            border-bottom: 1px solid #E2E8F0;
        }
        .lock-icon-circle {
            width: 72px;
            height: 72px;
            background: #E0E7FF;
            color: #3730A3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem;
            margin: 0 auto 1.25rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }
        .lock-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0F172A;
            line-height: 1.3;
        }
        .lock-subtitle {
            font-size: 0.88rem;
            color: #64748B;
            margin-top: 0.35rem;
            font-weight: 500;
        }
        .lock-body {
            padding: 2rem;
        }
        .message-box {
            background: #F8FAFC;
            border: 1px solid #CBD5E1;
            border-left: 4px solid #3B82F6;
            border-radius: 8px;
            padding: 1.25rem;
            color: #334155;
            font-size: 0.92rem;
            font-weight: 500;
            line-height: 1.55;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .ref-card {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            padding: 0.85rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            text-align: left;
        }
        .ref-label {
            font-size: 0.72rem;
            color: #64748B;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .ref-code {
            font-family: monospace;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0F172A;
            letter-spacing: 0.05em;
        }
        .contact-cta {
            background: #EFF6FF;
            border: 1px solid #BFDBFE;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .contact-cta h4 {
            font-size: 0.82rem;
            color: #1E40AF;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
        }
        .contact-number {
            font-size: 1.45rem;
            font-weight: 800;
            color: #1D4ED8;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="lock-container">
        <div class="lock-header">
            <div class="lock-icon-circle">
                📋
            </div>
            <h1 class="lock-title">{{ lic.title }}</h1>
            <p class="lock-subtitle">Crescent Islamic High School • Seat Allocation Engine</p>
        </div>

        <div class="lock-body">
            <div class="message-box">
                <strong>System Notice:</strong><br>
                {{ lic.message }}
            </div>

            <div class="ref-card">
                <div>
                    <div class="ref-label">Product Registration Reference</div>
                    <div class="ref-code">{{ lic.ref_id }}</div>
                </div>
                <button onclick="navigator.clipboard.writeText('{{ lic.ref_id }}'); alert('Reference ID copied to clipboard!');" class="btn btn-outline btn-sm" style="font-size: 0.78rem;">
                    📋 Copy Reference
                </button>
            </div>

            <div class="contact-cta">
                <h4>Technical Support & License Activation</h4>
                <div class="contact-number">{{ lic.contact }}</div>
                <div style="margin-top: 0.75rem;">
                    <a href="https://wa.me/91{{ lic.contact }}?text=Hello,%20I%20am%20using%20Crescent%20Seat%20Management%20System.%20My%20Reference%20Code%20is:%20{{ lic.ref_id }}" target="_blank" class="btn btn-success btn-sm" style="font-size: 0.85rem; padding: 0.5rem 1rem;">
                        💬 Contact on WhatsApp
                    </a>
                </div>
            </div>

            <form action="{{ url_for('refresh_license') }}" method="POST" style="margin-top: 1rem;">
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    🔄 Re-Check License Status
                </button>
            </form>
        </div>
    </div>
</body>
</html>
